# Default-deny egress for agent runtimes, with explicit holes for DNS and the
# MCP gateway. Everything else outbound fails closed. Exfiltration needs a
# route out; this removes it.
#
# Agent runtime pods MUST carry app.kubernetes.io/component=agent-runtime or
# this policy does not select them. The Gatekeeper constraint enforces that.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-default-deny-egress
  namespace: ai-agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: agent-runtime
  policyTypes:
    - Egress
  egress:
    # DNS only to the cluster resolver (UDP and TCP; large answers use TCP)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The MCP gateway, nothing else. The model endpoint is reached through the
    # egress proxy below, never directly.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-gateway
      ports:
        - protocol: TCP
          port: 3001
    # An egress proxy with an FQDN allowlist (model endpoint, approved MCP
    # servers). Adjust the namespace and labels to your proxy.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: egress-proxy
      ports:
        - protocol: TCP
          port: 3128
---
# The gateway itself may only talk to DNS and, through the egress proxy, to the
# authorization server's JWKS endpoint. No direct internet, no link-local
# (so the cloud instance metadata endpoint is unreachable), no private ranges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-egress
  namespace: ai-agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egress
          podSelector:
            matchLabels:
              app.kubernetes.io/name: egress-proxy
      ports:
        - protocol: TCP
          port: 3128
