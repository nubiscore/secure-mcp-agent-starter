apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-agents
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: mcp-gateway-config
    files:
      # An identical copy of tools/manifest.yaml. Kustomize refuses to read
      # files outside its root; CI fails if the two files drift.
      - manifest.yaml
      - kill-switch.json
    literals:
      # Replace with the hash printed by `pnpm manifest:hash` for the manifest you approved.
      - manifest_hash_pin=
generatorOptions:
  disableNameSuffixHash: true
