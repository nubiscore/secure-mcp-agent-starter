apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-agents
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - gatekeeper/template.yaml
  - gatekeeper/constraint.yaml
configMapGenerator:
  - name: mcp-gateway-config
    files:
      - manifest.yaml=../../tools/manifest.yaml
      - kill-switch.json
    literals:
      # Replace with the hash printed by CI for the manifest you approved.
      - manifest_hash_pin=
generatorOptions:
  disableNameSuffixHash: true
