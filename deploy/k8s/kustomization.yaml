apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-agents
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: mcp-gateway-config
    files:
      # tools/manifest.yaml with the deployed `resource`. Kustomize refuses to
      # read files outside its root; test/deploy-config.test.ts fails if the
      # two drift apart.
      - manifest.yaml
      - kill-switch.json
    literals:
      # Hash of deploy/k8s/manifest.yaml as reviewed. After reviewing a manifest
      # change, update it from `TOOL_MANIFEST=deploy/k8s/manifest.yaml pnpm manifest:hash`.
      # The gateway refuses to start in production without it, or if it differs.
      - manifest_hash_pin=sha256:c35eddaa80cdddf827c0f2cdccff04e2e8c74cd9c916d42187553d0625cd2ce5
generatorOptions:
  disableNameSuffixHash: true
