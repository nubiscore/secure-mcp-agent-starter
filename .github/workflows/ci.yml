name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Manifest hash
        run: pnpm manifest:hash
      - name: Kustomize renders
        run: |
          kubectl kustomize deploy/k8s > /tmp/base.yaml
          kubectl kustomize deploy/k8s/gatekeeper > /tmp/gatekeeper.yaml
          grep -q "kind: NetworkPolicy" /tmp/base.yaml && grep -q "kind: ConstraintTemplate" /tmp/gatekeeper.yaml

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: secure-mcp-agent-starter:ci
